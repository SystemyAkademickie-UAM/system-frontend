name: Docker build and push

on:
  push:
    branches:
      - production
      - developer
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Choose image tags
        id: image
        run: |
          image=ghcr.io/systemyakademickie-uam/system-frontend
          case "$GITHUB_REF_NAME" in
            production)
              {
                echo "tags<<EOF"
                echo "${image}:stable"
                echo "${image}:latest"
                echo "EOF"
              } >> "$GITHUB_OUTPUT"
              ;;
            developer)
              echo "tags=${image}:developer" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Ref $GITHUB_REF_NAME does not publish an image." >&2
              exit 1
              ;;
          esac

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Empty ARG: SPA uses location.origin + /api so one image serves both hosts.
          # Leave vars.VITE_API_BASE_URL unset. A set value pins a single host and breaks the other.
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
          tags: ${{ steps.image.outputs.tags }}

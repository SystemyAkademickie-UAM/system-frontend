name: Docker build and push (production)

on:
  push:
    branches:
      - production
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          no-cache: true
          # Empty ARG: SPA uses location.origin + /api so one image serves WMI and playground.
          # Leave vars.VITE_API_BASE_URL unset. A set value pins a single host and breaks the other.
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
          tags: |
            ghcr.io/systemyakademickie-uam/system-frontend:latest
            ghcr.io/systemyakademickie-uam/system-frontend:production

server {
    listen 3000;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API — browser calls http://<ui-host>:3000/api/... ; nginx forwards to Nest on the Docker host.
    location /api/ {
        # Default nginx limit is 1m; drive banner uploads allow up to 4 MiB (+ multipart/json overhead).
        client_max_body_size 5m;
        proxy_pass http://academy-api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Vite hashed files live only in this image. Missing names must 404 (not index.html),
    # or the browser treats JS as text/html after a deploy.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}

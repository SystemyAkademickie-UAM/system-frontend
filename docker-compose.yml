services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_ENV: ${NODE_ENV:-development}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:3000"
    environment:
      MAQ_DOCUMENTS_PATH: /mnt/documents
    volumes:
      - ./public/documents:/mnt/documents:ro
    networks:
      - academy-network

networks:
  academy-network:
    external: true
